name: Settlemaker Service CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: HTTP smoke
        run: |
          PORT=3100 node server.mjs > /tmp/kelo-settlemaker.log 2>&1 &
          PID=$!
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3100/health > /tmp/health.json; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:3100/health
          curl -fsS -X POST http://127.0.0.1:3100/generate \
            -H 'content-type: application/json' \
            -d '{"seed":42,"population":12000,"walls":true,"plaza":true,"citadel":true,"temple":true,"capital":true,"port":false,"roadBearings":[0,90,180,270]}' \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(j.geojson?.type!=='FeatureCollection'||j.geojson.features.length<10)process.exit(1);console.log('features',j.geojson.features.length)})"
          kill $PID
